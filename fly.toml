# Fly.io config. Run `fly launch --no-deploy --copy-config` once and pick a unique app name.
app = "shuka-marketplace"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "3000"

# Persistent volume: SQLite database, uploads and daily backups survive redeploys.
[mounts]
  source = "shuka_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
